# =============================================================
# Keycloak — https://auth.apli.indiolab.com.br
# KC_HTTP_ENABLED=true, Nginx faz TLS termination
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.apli.indiolab.com.br;

    ssl_certificate     /etc/ssl/apli/wildcard.crt;
    ssl_certificate_key /etc/ssl/apli/wildcard.key;
    include /etc/nginx/snippets/apli-tls.conf;

    # Admin console precisa de buffers maiores (cookies grandes)
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;

        # WebSocket (admin console)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
