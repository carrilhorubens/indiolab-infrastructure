# =============================================================
# Nginx reverse proxy — apli.indiolab.com.br
# =============================================================
# Servidor: 10.1.56.56 (rede interna, AD Microsoft)
# TLS: cert wildcard self-signed *.apli.indiolab.com.br
# Pattern: cada subdomínio termina TLS aqui e faz proxy_pass
#          para um container rodando em localhost:<porta>
#
# Instalar em: /etc/nginx/sites-available/apli.indiolab.com.br
# Ativar com:  ln -s /etc/nginx/sites-available/apli.indiolab.com.br \
#                    /etc/nginx/sites-enabled/apli.indiolab.com.br
#              nginx -t && systemctl reload nginx
#
# TODO (preencher conforme o servidor):
# - Caminhos do cert/key: /etc/ssl/apli/wildcard.crt e .key
#   (ajustar se usam outro path — ver o vhost antigo *.app.indiolab.com.br)
# - Portas localhost de cada container (marcadas com <PORT_XXX> abaixo)
#   Valores a verificar no docker-compose atual
# =============================================================

# ── Redirecionar HTTP para HTTPS (todos os subdomínios apli) ──
server {
    listen 80;
    listen [::]:80;
    server_name erp.apli.indiolab.com.br
                crm.apli.indiolab.com.br
                chat.apli.indiolab.com.br
                admin.apli.indiolab.com.br
                auth.apli.indiolab.com.br;
    return 301 https://$host$request_uri;
}

# ── Bloco reutilizável: SSL + headers comuns ──────────────────
# Usar via:  include /etc/nginx/snippets/apli-tls.conf;
# Salvar em: /etc/nginx/snippets/apli-tls.conf
#
#   ssl_certificate     /etc/ssl/apli/wildcard.crt;
#   ssl_certificate_key /etc/ssl/apli/wildcard.key;
#   ssl_protocols       TLSv1.2 TLSv1.3;
#   ssl_ciphers         HIGH:!aNULL:!MD5;
#   ssl_prefer_server_ciphers on;
#   ssl_session_cache   shared:SSL:10m;
#   ssl_session_timeout 1d;
#
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#   add_header X-Frame-Options "SAMEORIGIN" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# =============================================================
# ERP — https://erp.apli.indiolab.com.br
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.apli.indiolab.com.br;

    ssl_certificate     /etc/ssl/apli/wildcard.crt;
    ssl_certificate_key /etc/ssl/apli/wildcard.key;
    include /etc/nginx/snippets/apli-tls.conf;

    # Frontend (erp-web → container nginx)
    location / {
        proxy_pass         http://127.0.0.1:<PORT_ERP_WEB>;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend (erp-api) no subpath /api
    location /api/ {
        proxy_pass         http://127.0.0.1:<PORT_ERP_API>/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    client_max_body_size 50M;
}

