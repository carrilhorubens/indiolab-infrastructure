# =============================================================
# iChat — https://chat.apli.indiolab.com.br
# Observação: precisa de WebSocket (SignalR)
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.apli.indiolab.com.br;

    ssl_certificate     /etc/ssl/apli/wildcard.crt;
    ssl_certificate_key /etc/ssl/apli/wildcard.key;
    include /etc/nginx/snippets/apli-tls.conf;

    location / {
        proxy_pass         http://127.0.0.1:<PORT_ICHAT_WEB>;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:<PORT_ICHAT_API>/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (SignalR hub em /api/hubs/*)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    client_max_body_size 50M;
}

